name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          pip install black ruff bandit

      - name: black (format check)
        run: black --check .

      - name: ruff (lint)
        run: ruff check .

      - name: bandit (security)
        run: bandit -r pcc_bulletin/ -ll

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: ./scripts/test.sh
